# Free Supabase projects are paused after about a week without activity, which takes login and
# every map offline. This workflow runs a small database query every 3 days so the project
# keeps counting as active. If the project is paused anyway, the run fails and GitHub e-mails
# the repository owner: restore it at supabase.com/dashboard.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secrets do Supabase não configurados."
            exit 1
          fi
          # Public, read-only query (the plan list); it reaches Postgres, which is what counts.
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 -m 30 \
            "$VITE_SUPABASE_URL/rest/v1/plans?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY") || status="sem resposta"
          echo "Resposta do Supabase: $status"
          if [ "$status" != "200" ]; then
            echo "::error title=Supabase fora do ar::O projeto não respondeu ($status). Se estiver pausado, restaure em https://supabase.com/dashboard."
            exit 1
          fi
